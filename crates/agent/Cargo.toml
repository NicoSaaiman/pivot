[package]
name = "pivot-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
runtime = { path = "../runtime" }
shared = { path = "../shared" }

axum = { version = "0.8", features = ["json"] }
bollard = "0.21"
libc = "0.2"
reqwest = { version = "0.13", features = ["json"] }
serde = { version ="1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tower = "0.5"

[dev-dependencies]
test-utils = { path = "../test-utils" }
wiremock = "0.6"
